# The Xcode project is generated from this file; ImgManager.xcodeproj is not committed.
# Pattern ported from the estate's reference project (memos-ng-ios/project.yml — "A
# hand-maintained .xcodeproj is an opaque, merge-hostile artefact: the agents that write
# this code work on a Linux machine and cannot author or review one, and two people
# touching the same project file conflict on generated UUIDs. This file is the project.").
#
# P0a shipped one universal SwiftUI app, simulator ad-hoc signing, no entitlements, no app
# groups, no signing team; P0b added the TestFlight release pipeline (still no entitlements).
# P1 (WP8, IMGMGR-169) is the first phase to add one: keychain-access-groups plus the
# imgmanager:// URL scheme, both below.
include:
  - path: signing.default.yml
  - path: signing.local.yml    # per-machine; bin/generate.sh stubs it when absent

name: ImgManager

options:
  bundleIdPrefix: live.discomarder
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # P1 fix (WP8, IMGMGR-169; RED-proven — see .phase-ledger.md): `MainActor` as the PROJECT
    # base made a plain, unmarked struct's own init/methods (Keychain, called from inside the
    # CredentialStore actor's synchronous init) implicitly MainActor-isolated, which an actor's
    # own isolation domain cannot call without `await` — impossible inside a non-async init.
    # `nonisolated` is the base default the reference project uses for exactly this reason
    # (memos-ng-ios/project.yml:30) — every type that genuinely needs MainActor (SwiftUI Views
    # via the framework's own `View` requirement; `SignInCoordinator`, `AuthSession`,
    # `NativeLoginCallbackInbox`, `SafariLoginBrowser`, the `LoginBrowser` protocol) is marked
    # `@MainActor` explicitly in this codebase already, so this flip changes nothing for them —
    # `nonisolated` is strictly MORE callable (from any isolation domain, MainActor included),
    # never less, so no existing P0a/P3 code path narrows.
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    # Universal app — iPhone AND iPad from one target, one layout declaration (plan
    # invariant: "no idiom branching", [/link/3220] §1.3). TARGETED_DEVICE_FAMILY "1,2"
    # is the family declaration only; the layout code itself never reads idiom.
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  ImgManagerAPI:
    path: Packages/ImgManagerAPI

# The test bundle is hosted in the app (mirrors memos-ng-ios: a host-less bundle has no
# keychain entitlement in the simulator, and P1's native-auth lane will need one).
targets:
  ImgManager:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/ImgManager
        excludes:
          - Resources/ReleaseNotes.md
      # IMGMGR-587: the release notes ship in the app (Settings › About › Version opens them) and
      # are also the TestFlight "What to Test" text (fastlane/lib/release_notes.rb). Named with an
      # explicit resources phase rather than left to XcodeGen's per-extension default, so the
      # bundle carries them whatever that default does with `.md`.
      - path: Sources/ImgManager/Resources/ReleaseNotes.md
        buildPhase: resources
    dependencies:
      - package: ImgManagerAPI
      # WP12 (IMGMGR-199): XcodeGen puts an embedded app extension in the app's
      # "Embed App Extensions" copy phase, i.e. ImgManager.app/PlugIns/ImgManagerWidget.appex —
      # which is exactly what the gate's `widget-embed` leg asserts on the BUILT bundle rather
      # than trusting this line (bin/mac-gate.sh).
      - target: ImgManagerWidget
        embed: true
    # Generated by XcodeGen into ImgManager.entitlements — no team id anywhere: the group
    # takes its team prefix from $(AppIdentifierPrefix), which Xcode expands when it processes
    # this file (mirrors memos-ng-ios/project.yml, same mechanism). P1 (WP8, IMGMGR-169) is the
    # first phase that needs an entitlement at all — P0a/P0b deliberately shipped with none.
    # EXACTLY ONE keychain-access-groups entry, matching the pinned contract
    # (p1-spec-rev2.md §3 item 3) verbatim: no associated-domains entry, because Adjudication A
    # (docs — see p1-spec-rev2.md) pins the custom-scheme return lane and explicitly refuses the
    # AASA/universal-link lane for this deployment (img.discomarder.live resolves to a private
    # address; Apple's CDN cannot fetch an AASA from it).
    entitlements:
      path: ImgManager.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)live.discomarder.imgmanager.credentials"
    # GENERATE_INFOPLIST_FILE: YES below still merges the INFOPLIST_KEY_* settings into this
    # partial plist — CFBundleURLTypes has no INFOPLIST_KEY_ build-setting form, so it lives
    # here (mirrors memos-ng-ios's project.yml `info:` block, same path convention, same
    # merge mechanism).
    info:
      path: Support/Info.plist
      properties:
        # The custom-scheme return lane (Adjudication A): the backend's `/ios/auth/callback`
        # HTTPS interstitial forwards the handoff code to imgmanager://auth-callback?<query>
        # verbatim (app/api/auth.py::ios_auth_callback, img-manager v0.9.2). Any app on the
        # phone could claim this scheme — nothing that crosses it is trusted for being on it;
        # what crosses it is a one-shot handoff code worthless without the PKCE verifier, which
        # never leaves this process (NativeAuthContract.swift).
        CFBundleURLTypes:
          - CFBundleURLName: live.discomarder.imgmanager.auth
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - imgmanager
        # WP31 P2 (IMGMGR-461): native-to-native Handoff of a Triage pass (`TriageActivity`).
        # Between two devices of one Apple ID running this app, the declared activity type is
        # all Handoff needs — no entitlement, no associated domains, no `webpageURL`, so
        # Adjudication A above is untouched.
        NSUserActivityTypes:
          - live.discomarder.imgmanager.triage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.imgmanager
        PRODUCT_NAME: ImgManager
        # P0b fold item 3: a real 1024x1024 icon binds here — Assets.xcassets/AppIcon.appiconset
        # under Sources/ImgManager, picked up automatically by XcodeGen's default asset-catalog
        # detection (no extra `sources:` entry needed — mirrors memos-ng-ios/project.yml).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: img-manager
        # NO is the truthful answer — HTTPS through the system's own TLS is exempt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "0.15.4"
        CURRENT_PROJECT_VERSION: "26"
  # WP12 (IMGMGR-199): the readiness widget. An app extension is its OWN process with its OWN
  # data container — it shares nothing with the app but the Keychain access group (one entry, the
  # app's, copied verbatim below) and the source files listed here, which are compiled into BOTH
  # targets. There is no App Group in v1: the only cross-process state is the credential, and the
  # Keychain already carries it.
  #
  # The `sources:` list is deliberately explicit and small — an extension is memory-budgeted and
  # has no business containing the grid stack, `AuthSession` (it must never renew), or any
  # SwiftUI view of the app's. Everything listed is reachable from the timeline provider:
  # the queue vocabulary and its read-only service, the credential/Keychain pair, the generated
  # client's factory and Bearer-injecting transport, the one degraded-state string, and
  # `GridSourceTier` (which `QueueModels.swift` references — see GridSourceTier.swift's own note).
  # The shared `Widget/` directory carries the entry, its builder, the snapshot store and the
  # resolver: they live under Sources/ImgManager so the app target picks them up recursively and
  # `ImgManagerTests`' `@testable import ImgManager` can see them, and they are listed here so
  # the extension compiles the SAME files rather than a copy that can drift.
  ImgManagerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/ImgManagerWidget
      - path: Sources/ImgManager/Widget
      - path: Sources/ImgManager/Queue/QueueModels.swift
      - path: Sources/ImgManager/Queue/QueueService.swift
      - path: Sources/ImgManager/Grid/GridSourceTier.swift
      - path: Sources/ImgManager/Auth/Keychain.swift
      - path: Sources/ImgManager/Auth/CredentialStore.swift
      - path: Sources/ImgManager/Transport/ConnectivityState.swift
      - path: Sources/ImgManager/Transport/ImgManagerAPIClient.swift
      - path: Sources/ImgManager/Transport/AuthenticatedClientTransport.swift
    # Declared explicitly: embedding an extension does NOT hand it the app's package
    # dependencies, and every file above imports ImgManagerAPI.
    dependencies:
      - package: ImgManagerAPI
    # The SAME single entry as the app, verbatim — the extension reads the app's credential out
    # of the shared group; it never writes one and never renews.
    entitlements:
      path: ImgManagerWidget.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)live.discomarder.imgmanager.credentials"
    # NSExtension has no INFOPLIST_KEY_ build-setting form, so it lives in a partial plist that
    # GENERATE_INFOPLIST_FILE merges the INFOPLIST_KEY_* settings into — same mechanism and same
    # path convention as the app's Support/Info.plist above. A SwiftUI widget needs no
    # NSExtensionPrincipalClass: @main WidgetBundle is the entry point.
    info:
      path: Support/ImgManagerWidget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.imgmanager.readiness-widget
        PRODUCT_NAME: ImgManagerWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shoot readiness
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # App Store validation refuses an archive whose embedded extension carries a version
        # other than its container app's — these two must move in lockstep with the app's.
        MARKETING_VERSION: "0.15.4"
        CURRENT_PROJECT_VERSION: "26"
        # An extension is installed as part of its host app, never on its own.
        SKIP_INSTALL: YES

  ImgManagerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/ImgManagerTests
    dependencies:
      - target: ImgManager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # Diff-gate round 2, item 9(a) follow-up: the ONE thing a unit-test target cannot do —
  # drive a real device orientation and capture a real screen — needs `xcuitest`'s own
  # headless-capable runner (`xcodebuild test` drives UI tests without a live/unlocked GUI
  # session, unlike Simulator.app UI automation). Sources only the one orientation/screenshot
  # test named for that purpose — never a general UI-automation surface.
  ImgManagerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/ImgManagerUITests
    dependencies:
      - target: ImgManager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ImgManager:
    build:
      targets:
        ImgManager: all
        ImgManagerWidget: all
        ImgManagerTests: [test]
        ImgManagerUITests: [test]
    test:
      targets:
        - ImgManagerTests
        - ImgManagerUITests
      commandLineArguments: {}
